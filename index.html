<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>やきたて！まるパン だいぼうけん</title>
<style>
html,body{margin:0;height:100%;background:#2a1a10;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px;box-shadow:0 0 50px rgba(0,0,0,.6)}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tb{position:absolute;pointer-events:auto;width:72px;height:72px;border-radius:50%;background:rgba(255,240,210,.32);border:3px solid rgba(255,255,255,.6);color:#fff;font:bold 15px sans-serif;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 3px #000;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch">
  <div class="tb" data-k="left" style="left:16px;bottom:22px">◀</div>
  <div class="tb" data-k="right" style="left:102px;bottom:22px">▶</div>
  <div class="tb" data-k="down" style="left:59px;bottom:104px">はく</div>
  <div class="tb" data-k="act" style="right:104px;bottom:22px">すう</div>
  <div class="tb" data-k="jump" style="right:16px;bottom:80px">ジャンプ</div>
</div>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="stages/1-1.js"></script>
<script src="stages/1-2.js"></script>
<script src="stages/1-3.js"></script>
<script src="stages/2-1.js"></script>
<script src="stages/2-2.js"></script>
<script src="stages/2-3.js"></script>
<script src="stages/3-1.js"></script>
<script src="stages/3-2.js"></script>
<script src="stages/3-3.js"></script>
<script src="js/world.js"></script>
<script src="js/bread.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/enemies/land.js"></script>
<script src="js/enemies/sea.js"></script>
<script src="js/enemies/rock.js"></script>
<script src="js/boss.js"></script>
<script src="js/bosses/koge.js"></script>
<script src="js/bosses/koge-water.js"></script>
<script src="js/bosses/koge-rock.js"></script>
<script src="js/objects.js"></script>
<script src="js/themes.js"></script>
<script src="js/themes/bread.js"></script>
<script src="js/themes/sea.js"></script>
<script src="js/themes/mountain.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
