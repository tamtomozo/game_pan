const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function circleRect(cx,cy,r,b){const nx=clamp(cx,b.x,b.x+b.w),ny=clamp(cy,b.y,b.y+b.h);const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ell(c,x,y,rx,ry,fill,stroke,lw,rot){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=lw||2;c.strokeStyle=stroke;c.stroke();}}
function txt(s,x,y,size,fill='#fff',stroke='#5a2a0c',align='center',lw){
  ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke){ctx.lineWidth=lw||Math.max(3,size/5);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function seeded(n,seed){let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;return[...Array(n)].map(()=>[r(),r(),r()]);}

let AC=null,master=null,muted=false,noiseBuf=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.4;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,dur,type='square',vol=0.1,slide=null,delay=0,at=null){
  if(!AC||muted)return;
  const t=(at!=null?at:AC.currentTime)+delay;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol=0.1,freq=1000,delay=0){
  if(!AC||muted)return;
  const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=0.8;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}

function isSolid(t){return t==='#'||t==='B'||t==='~'||t==='L';}
function tileAt(tx,ty){if(tx<0||tx>=lv.w)return'#';if(ty<0||ty>=ROWS)return'.';return lv.t[ty][tx];}
function tileAtP(x,y){return tileAt(Math.floor(x/TS),Math.floor(y/TS));}

function buildRows(chunks){
  const rows=Array(ROWS).fill('');
  for(const s of chunks){
    const ch=s.split('\n').map(l=>l.trim()).filter(l=>l.length);
    const w=Math.max(...ch.map(r=>r.length)),pad=ROWS-ch.length;
    for(let r=0;r<ROWS;r++)rows[r]+=(r<pad?'':ch[r-pad]).padEnd(w,'.');
  }
  return rows;
}
function setBanner(text,sub,t,form){G.banner={text,sub,t,max:t,form};}

function loadStage(i,cp){
  const S=STAGES[i];G.stage=i;G.theme=S.theme;
  const rows=buildRows(S.chunks);
  lv={w:rows[0].length,t:rows.map(r=>r.split('')),wob:{},arenaX:null,arenaCol:null,locked:false};
  enemies=[];items=[];projs=[];parts=[];signs=[];checks=[];goal=null;boss=null;
  let start=null,si=0;
  for(let x=0;x<lv.w;x++)for(let y=0;y<ROWS;y++){
    const c=lv.t[y][x];let clear=true;
    if(c==='P')start={x,y};
    else if(ECHAR[c]){const D=ENEMY[ECHAR[c]];spawnEnemy(ECHAR[c],x*TS+(TS-D.w)/2,(y+1)*TS-D.h);}
    else if(c==='*')items.push({type:'grain',x:x*TS+8,y:y*TS+8,w:16,h:16,t:x*7});
    else if(c==='H')items.push({type:'heart',x:x*TS+5,y:y*TS+5,w:22,h:22,t:0});
    else if(c==='S')signs.push({x:x*TS+16,y:(y+1)*TS,text:S.signs[si++]||''});
    else if(c==='K')checks.push({x:x*TS+16,y:(y+1)*TS,on:false});
    else if(c==='G')goal={x:x*TS+16,y:(y+1)*TS};
    else if(c==='|'){lv.arenaX=x*TS;lv.arenaCol=x;}
    else if(c==='X')boss={x:x*TS-34,y:(y+1)*TS-92,w:100,h:92,vx:0,vy:0,hp:30,max:30,state:'sleep',t:0,dir:-1,hit:0,s:1,sv:0,mouth:0,jit:0,dropT:0,onGround:true,sqx:1,sqy:1,lean:0};
    else clear=false;
    if(clear)lv.t[y][x]='.';
  }
  let sx=start.x*TS+4,sy=(start.y+1)*TS-26;
  if(cp){sx=cp.x-12;sy=cp.y-26;for(const k of checks)if(k.x===cp.x)k.on=true;}
  player={x:sx,y:sy,w:24,h:26,vx:0,vy:0,face:1,onGround:false,form:'plain',hp:G.maxHp,inv:0,s:1,sv:0,jumps:2,coyote:0,jbuf:0,dropT:0,
    roll:0,rollCd:0,big:1,rot:0,whip:0,whipHit:new Set(),fireT:0,inhaling:false,blinkT:120,walkT:0,dead:false,deathT:0,springT:0,
    hurtT:0,needRelease:false,lastSafe:{x:sx,y:sy},t:0};
  cam.minX=0;cam.maxX=lv.w*TS-W;cam.x=clamp(player.x-W/2+80,cam.minX,cam.maxX);
  G.state='play';G.freeze=0;G.paused=false;G.flash=0;
  if(cp)setBanner('もういっかい！','',70);else setBanner('ステージ '+(i+1),S.name,160);
  playBGM(S.bgm);
}
function spawnEnemy(type,x,y){
  const D=ENEMY[type];
  const e={type,x,y,w:D.w,h:D.h,vx:0,vy:0,hp:D.hp,dir:-1,t:(Math.random()*60)|0,hit:0,shake:0,active:false,dead:false,suckT:0,thrown:0,rot:0,onGround:false,wind:0,windMax:1,act:'',dash:0,dashSp:0,cool:0,sqx:1,sqy:1,lean:0};
  if(type==='bird'){e.baseY=y;e.homeX=x;}
  enemies.push(e);return e;
}
function startGame(){G.score=0;G.grains=0;G.cp=null;loadStage(0);}

// ---------- 物理 ----------
function moveBody(b){
  b.hitWall=0;
  b.x+=b.vx;
  let x0=Math.floor(b.x/TS),x1=Math.floor((b.x+b.w-0.01)/TS),y0=Math.floor(b.y/TS),y1=Math.floor((b.y+b.h-0.01)/TS);
  if(b.vx>0){for(let ty=y0;ty<=y1;ty++)if(isSolid(tileAt(x1,ty))){b.x=x1*TS-b.w;b.vx=0;b.hitWall=1;break;}}
  else if(b.vx<0){for(let ty=y0;ty<=y1;ty++)if(isSolid(tileAt(x0,ty))){b.x=(x0+1)*TS;b.vx=0;b.hitWall=-1;break;}}
  const prevBottom=b.y+b.h;
  b.y+=b.vy;
  x0=Math.floor(b.x/TS);x1=Math.floor((b.x+b.w-0.01)/TS);y0=Math.floor(b.y/TS);y1=Math.floor((b.y+b.h-0.01)/TS);
  b.onGround=false;b.onDough=false;b.onOneWay=false;
  if(b.vy>0){
    let land=false,solid=false,dough=false;
    for(let tx=x0;tx<=x1;tx++){
      const t=tileAt(tx,y1);
      if(isSolid(t)){land=true;solid=true;if(t==='~')dough=true;}
      else if(t==='='&&!b.dropT&&prevBottom<=y1*TS+1)land=true;
    }
    if(land){b.y=y1*TS-b.h;b.vy=0;b.onGround=true;b.onDough=dough;b.onOneWay=!solid;}
  }else if(b.vy<0){
    for(let tx=x0;tx<=x1;tx++)if(isSolid(tileAt(tx,y0))){b.y=(y0+1)*TS;b.vy=0;break;}
  }
}
function breakAt(x,y,r){
  let hit=false;
  const x0=Math.floor((x-r)/TS),x1=Math.floor((x+r)/TS),y0=Math.floor((y-r)/TS),y1=Math.floor((y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(ty<0||ty>=ROWS||tx<0||tx>=lv.w)continue;
    if(lv.t[ty][tx]==='B'){
      lv.t[ty][tx]='.';hit=true;
      burst(tx*TS+16,ty*TS+16,['#f0d29a','#c99a5a','#fff0c8'],10,4);sfx('brk');G.shake=Math.max(G.shake,3);
    }
  }
  return hit;
}
function groundAhead(e,dist){
  const fx=e.dir>0?e.x+e.w+dist:e.x-dist;const t=tileAt(Math.floor(fx/TS),Math.floor((e.y+e.h+2)/TS));
  return isSolid(t)||t==='=';
}

// ---------- パーティクル ----------
function addP(o){const q=Object.assign({type:'dot',x:0,y:0,vx:0,vy:0,life:30,size:3,color:'#fff',g:0,drag:1},o);q.max=q.life;parts.push(q);return q;}
function burst(x,y,cols,n=12,sp=4){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(sp*0.3,sp);addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:(rand(18,34))|0,size:rand(2,4.5),color:cols[i%cols.length],g:0.15,drag:0.96});}}
function sparkle(x,y,n=6,col='#fff8c0'){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(1,3.5);addP({type:'star',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:(rand(20,36))|0,size:rand(4,8),color:col,drag:0.93});}}
function ring(x,y,color,size=30){addP({type:'ring',x,y,life:18,size,color});}
function dust(x,y,n=5,dir=0){for(let i=0;i<n;i++)addP({type:'smoke',x:x+rand(-8,8),y:y-rand(0,4),vx:rand(-1.2,1.2)+dir,vy:rand(-1,-0.2),life:(rand(16,26))|0,size:rand(4,7),color:'rgba(255,245,225,0.8)',drag:0.94});}
function popText(x,y,s,color='#fff'){addP({type:'text',x,y,vy:-1.3,life:50,text:s,color,drag:0.97});}
function addScore(n,x,y){G.score+=n;if(x!=null)popText(x,y,'+'+n,'#fff6b0');}

// =====================================================================
//  プレイヤー
// =====================================================================
function phb(){const p=player;return{x:p.x+3,y:p.y+4,w:p.w-6,h:p.h-5};}
function rollCircle(){const p=player;return{x:p.x+p.w/2,y:p.y+p.h-16*p.big,r:32*p.big};}
function springPlayer(){
  const p=player;let tgt=1;
  if(!p.onGround)tgt=1+clamp(-p.vy*0.012,-0.1,0.14);
  else if(K.down&&p.form==='plain'&&p.roll<=0&&G.state==='play')tgt=0.72;
  p.sv+=(tgt-p.s)*0.2;p.sv*=0.84;p.s+=p.sv;p.s=clamp(p.s,0.45,1.6);
}
function whipPts(p){
  const ph=24-p.whip,pr=Math.min(1,ph/9),ease=1-Math.pow(1-pr,3);
  const a=-2.2+ease*2.35;let len=48+132*Math.min(1,ph/6);if(ph>15)len*=Math.max(0,p.whip/9);
  const cx=p.x+p.w/2,cy=p.y+p.h*0.55,pts=[];
  for(let i=1;i<=7;i++){const t=i/7,sag=Math.sin(t*Math.PI)*7*(1-ease);pts.push({x:cx+Math.cos(a)*len*t*p.face,y:cy+Math.sin(a)*len*t+sag});}
  return{pts,a};
}

function updatePlayer(){
  const p=player;p.t++;
  if(p.dead){p.deathT--;p.vy=Math.min(p.vy+0.35,8);p.y+=p.vy;p.rot+=0.12;if(p.deathT<=0)loadStage(G.stage,G.cp);return;}
  if(p.inv>0)p.inv--;if(p.dropT>0)p.dropT--;if(p.rollCd>0)p.rollCd--;if(p.springT>0)p.springT--;if(p.hurtT>0)p.hurtT--;
  if(--p.blinkT<-6)p.blinkT=(rand(120,280))|0;
  if(!K.act||P.act)p.needRelease=false;
  const actH=K.act&&!p.needRelease,actP=P.act;
  const f=p.form,move=(K.left?-1:0)+(K.right?1:0);
  p.inhaling=f==='plain'&&actH&&p.hurtT<=0;
  const breathing=f==='curry'&&actH&&p.hurtT<=0;

  // はきだす
  if((P.down||P.spit)&&f!=='plain'&&p.hurtT<=0)spit();
  // こうげき開始
  if(actP&&p.hurtT<=0){
    if(f==='anko'&&p.roll<=0&&p.rollCd<=0){p.roll=80;sfx('roll');p.s=0.7;p.sv=0;}
    else if(f==='melon'&&!projs.some(q=>q.type==='boomer')){projs.push({type:'boomer',x:p.x+p.w/2+p.face*16,y:p.y+p.h*0.45,vx:p.face*11,vy:0,r:28,ang:0,friendly:true,t:0});sfx('throw');p.s=0.85;}
    else if(f==='wiener'&&p.whip<=0){p.whip=24;p.whipHit=new Set();sfx('whip');}
  }
  // 横移動
  if(p.roll>0){
    p.roll--;p.vx=p.face*8.5;if(p.roll===0)p.rollCd=18;
    if(p.onGround&&G.t%3===0)dust(p.x+p.w/2-p.face*14,p.y+p.h,1,-p.face);
    const rc=rollCircle();breakAt(rc.x+p.face*rc.r*0.7,rc.y,rc.r*0.75);
  }else if(p.hurtT>0){p.vx*=0.93;}
  else{
    let mx=3.8;if(p.inhaling)mx=0.9;else if(breathing)mx=1.3;else if(p.whip>0&&p.onGround)mx=1.6;
    if(move){
      p.vx+=move*(p.onGround?0.6:0.42);
      if(p.vx>mx)p.vx=Math.max(mx,p.vx-0.8);if(p.vx<-mx)p.vx=Math.min(-mx,p.vx+0.8);
      if(!p.inhaling&&!breathing&&p.whip<=0)p.face=move;
    }else{p.vx*=p.onGround?0.7:0.92;if(Math.abs(p.vx)<0.1)p.vx=0;}
  }
  // ジャンプ
  if(p.onGround){p.coyote=6;p.jumps=2;}else if(p.coyote>0)p.coyote--;
  if(P.jump)p.jbuf=7;else if(p.jbuf>0)p.jbuf--;
  if(p.jbuf>0&&!p.inhaling&&p.hurtT<=0){
    if(K.down&&p.onGround&&p.onOneWay){p.dropT=14;p.jbuf=0;p.coyote=0;p.y+=2;}
    else if(p.coyote>0){p.vy=-11;p.coyote=0;p.jbuf=0;p.s=1.32;p.sv=0;sfx('jump');dust(p.x+p.w/2,p.y+p.h,4);}
    else if(P.jump&&p.jumps>0){
      p.jumps--;p.vy=-9;p.jbuf=0;p.s=1.25;p.sv=0;sfx('puff');
      ring(p.x+p.w/2,p.y+p.h,'rgba(255,255,255,0.9)',18);
      for(let i=0;i<4;i++)addP({type:'smoke',x:p.x+p.w/2+rand(-10,10),y:p.y+p.h,vx:rand(-1.5,1.5),vy:rand(0.5,1.5),life:18,size:5,color:'rgba(255,255,255,0.85)',drag:0.92});
    }
  }
  // 重力
  let g=0.55,maxFall=10;p.floating=false;
  if(p.vy<0&&!K.jump&&p.springT<=0)g=1.1;
  if(K.jump&&p.vy>0&&p.roll<=0&&p.hurtT<=0){g=0.2;maxFall=2.3;p.floating=true;}
  p.vy=Math.min(p.vy+g,maxFall);
  const wasGround=p.onGround,preVy=p.vy;
  p.prevBottom=p.y+p.h;
  moveBody(p);
  if(p.roll>0&&p.hitWall){p.face*=-1;G.shake=4;sfx('hit');sparkle(p.x+p.w/2-p.face*20,p.y+p.h/2,4);}
  if(p.onGround&&!wasGround){
    p.sv-=Math.min(0.32,0.05+preVy*0.028);
    if(preVy>5){dust(p.x+p.w/2,p.y+p.h,5);sfx('land');}
  }
  if(p.onGround&&p.onDough){
    p.vy=K.jump?-16.5:-14;p.onGround=false;p.springT=40;p.jumps=2;p.s=0.5;p.sv=0;
    const tx=Math.floor((p.x+p.w/2)/TS);lv.wob[tx]=1;lv.wob[tx-1]=Math.max(lv.wob[tx-1]||0,0.6);lv.wob[tx+1]=Math.max(lv.wob[tx+1]||0,0.6);
    sfx('boing');ring(p.x+p.w/2,p.y+p.h,'rgba(255,240,200,0.9)',26);
  }
  if(p.onGround&&!p.onDough)p.lastSafe={x:p.x,y:p.y};
  if(p.y>ROWS*TS+80){p.x=p.lastSafe.x;p.y=p.lastSafe.y-6;p.vy=0;p.vx=0;dust(p.x+p.w/2,p.y+p.h,8);sfx('puff');}
  springPlayer();
  if(p.onGround&&Math.abs(p.vx)>0.3&&p.roll<=0)p.walkT+=Math.abs(p.vx)*0.085;else p.walkT=0;
  p.big+=((p.roll>0?2:1)-p.big)*0.2;
  if(p.roll>0)p.rot+=p.vx/(16*p.big);else p.rot=0;

  // ファイヤー
  if(breathing){
    p.fireT++;
    if(p.fireT%3===1)projs.push({type:'fire',x:p.x+p.w/2+p.face*16,y:p.y+p.h*0.5+rand(-3,3),vx:p.face*rand(13,17)+p.vx*0.4,vy:rand(-0.7,0.5),r:12,life:24,max:24,friendly:true,t:0});
    if(p.fireT%10===1)sfx('fire');
  }else p.fireT=0;
  // すいこみ
  if(p.inhaling)doInhale();
  // むち
  if(p.whip>0){
    p.whip--;const ph=24-p.whip;
    if(ph>=4&&ph<=15){
      const{pts}=whipPts(p);
      for(let i=2;i<pts.length;i++){
        const pt=pts[i];breakAt(pt.x,pt.y,20);
        for(const e of enemies){if(!e.dead&&e.active&&!p.whipHit.has(e)&&circleRect(pt.x,pt.y,26,e)){p.whipHit.add(e);damageEnemy(e,3,p.face,4);}}
        if(boss&&!p.whipHit.has(boss)&&bossVulnerable()&&circleRect(pt.x,pt.y,26,bossHB())){p.whipHit.add(boss);hitBoss(3,12);}
      }
    }
  }
}
function doInhale(){
  const p=player,mx=p.x+p.w/2+p.face*10,my=p.y+p.h*0.55,R=270;
  if(G.t%2===0){const sx=mx+p.face*rand(40,R),sy=my+rand(-34,34);addP({type:'wind',x:sx,y:sy,sx,sy,tx:mx,ty:my,life:14,color:'rgba(255,255,255,0.8)'});}
  if(G.t%12===0)sfx('inhale');
  const inCone=(cx,cy)=>{const dx=(cx-mx)*p.face,dy=cy-my;return dx>-14&&dx<R&&Math.abs(dy)<56+dx*0.35;};
  for(const e of enemies){
    if(e.dead||!e.active)continue;
    const cx=e.x+e.w/2,cy=e.y+e.h/2;if(!inCone(cx,cy))continue;
    if(ENEMY[e.type].noInhale){e.shake=3;continue;}
    const dx=mx-cx,dy=my-cy,d=Math.hypot(dx,dy)||1,sp=Math.min(d,2.6+(R-d)*0.075);
    e.x+=dx/d*sp;e.y+=dy/d*sp;e.suckT=3;
    if(d<18){swallow(e);return;}
  }
  for(const it of items){
    if(it.dead)continue;
    const cx=it.x+it.w/2,cy=it.y+it.h/2;if(!inCone(cx,cy))continue;
    const dx=mx-cx,dy=my-cy,d=Math.hypot(dx,dy)||1,sp=Math.min(d,3+(R-d)*0.08);
    it.x+=dx/d*sp;it.y+=dy/d*sp;it.suckT=3;
    if(d<18){if(it.type==='ability'){it.dead=true;sfx('gulp');transform(it.ab);return;}collect(it);}
  }
}
function swallow(e){
  const p=player;e.dead=true;sfx('gulp');
  const ab=ENEMY[e.type].ability;
  if(ab)transform(ab);
  else{addScore(100,p.x+p.w/2,p.y-10);p.s=0.7;p.sv=0;}
}
function transform(ab){
  const p=player;p.form=ab;p.needRelease=true;G.freeze=28;G.flash=1;p.s=1.45;p.sv=0;p.roll=0;p.whip=0;
  const cx=p.x+p.w/2,cy=p.y+p.h/2;ring(cx,cy,'#fff',52);ring(cx,cy,'#ffd36a',36);sparkle(cx,cy,12);
  sfx('transform');setBanner(FORMS[ab].name+' に へんしん！',FORMS[ab].desc,120,ab);
}
function spit(){
  const p=player;
  projs.push({type:'star',ab:p.form,x:p.x+p.w/2+p.face*18,y:p.y+p.h*0.5,vx:p.face*10,vy:0,r:26,life:160,friendly:true,t:0});
  p.form='plain';p.roll=0;p.whip=0;p.s=0.7;p.sv=0;p.vx-=p.face*2;
  sfx('spit');ring(p.x+p.w/2+p.face*16,p.y+p.h/2,'#fff',16);
}
function collect(it){
  const p=player;it.dead=true;const cx=it.x+it.w/2,cy=it.y+it.h/2;
  if(it.type==='grain'){
    G.grains++;G.score+=10;sfx('coin');sparkle(cx,cy,4,'#ffe27a');
    if(G.grains%50===0&&p.hp<G.maxHp){p.hp++;sfx('heal');popText(cx,cy-16,'こむぎ50こ！ +1','#ffb0c0');}
  }else if(it.type==='heart'){
    p.hp=Math.min(G.maxHp,p.hp+2);sfx('heal');sparkle(cx,cy,10,'#ffb0c0');popText(cx,cy-10,'げんき +2','#ffb0c0');
  }
}
function hurtPlayer(srcX){
  const p=player;if(p.dead||p.inv>0||p.roll>0||G.state!=='play')return;
  p.hp--;p.inv=100;p.hurtT=16;
  const kx=(p.x+p.w/2<srcX)?-1:1;p.vx=kx*4.5;p.vy=-6;p.s=0.6;p.sv=0;p.whip=0;
  G.shake=8;sfx('hurt');burst(p.x+p.w/2,p.y+p.h/2,['#fff','#ffd36a'],8,4);
  if(p.form!=='plain'){
    items.push({type:'ability',ab:p.form,x:p.x+1,y:p.y-6,w:22,h:22,vx:-kx*2.5,vy:-8,bounce:-5,life:480,delay:45,t:0});
    p.form='plain';
  }
  if(p.hp<=0){p.dead=true;p.deathT=120;p.vy=-9;p.rot=0;stopBGM();sfx('die');G.shake=10;}
}

// ---- ふみつけ ----
// 上から落ちてきて当たったときだけ「ふんだ」あつかい（フォークは いたいので だめ）
function isStomp(topY){const p=player;return p.vy>=0&&p.prevBottom!=null&&p.prevBottom<=topY+10;}
function stompBounce(x,y,v=-8){
  const p=player;
  p.vy=K.jump?v-3:v;p.jumps=2;p.s=0.62;p.sv=0;p.y=Math.min(p.y,y-p.h);
  sfx('stomp');ring(x,y,'#fff',22);sparkle(x,y,5);dust(x,y,3);
  popText(x,y-20,'ふみっ！','#fff');
}
function damageEnemy(e,dmg,kd,inv=8){
  if(e.dead||e.hit>0)return false;
  e.hp-=dmg;e.hit=inv;
  if(e.hp<=0)killEnemy(e);
  else{sfx('hit');e.vx=kd*2;e.vy=-3;burst(e.x+e.w/2,e.y+e.h/2,ECOL[e.type],5,3);}
  return true;
}
function killEnemy(e){
  e.dead=true;const cx=e.x+e.w/2,cy=e.y+e.h/2;
  burst(cx,cy,ECOL[e.type],14,5);sparkle(cx,cy,5);ring(cx,cy,'#fff',26);addScore(100,cx,cy-12);sfx('pop');
}
// ---- よびどうさ（予備動作） ----
// jump:縦にちぢむ  dash:横にちぢんで のけぞる  turn/go:ちょっと止まって ちぢむ
function windup(e,act,frames){e.wind=frames;e.windMax=frames;e.act=act;e.vx=0;}
function playerAhead(e,dist){const p=player;if(p.dead)return false;const dx=(p.x+p.w/2-(e.x+e.w/2))*e.dir;return dx>0&&dx<dist&&Math.abs(p.y+p.h-(e.y+e.h))<40;}
function enemyAct(e){
  const cx=e.x+e.w/2,by=e.y+e.h;
  switch(e.act){
    case'jump':e.vy=-8;e.vx=e.dir*1.7;e.sqx=0.82;e.sqy=1.28;dust(cx,by,3);break;
    case'dash':e.dash=e.type==='fork'?30:40;e.dashSp=e.type==='fork'?4.2:3.6;e.sqx=1.3;e.sqy=0.8;dust(cx-e.dir*8,by,4,-e.dir*1.5);if(e.type==='fork')e.cool=110;break;
    case'turn':e.dir*=-1;e.sqx=1.15;e.sqy=0.9;break;
    case'go':e.sqx=1.15;e.sqy=0.9;break;
  }
}
function enemyPose(e){
  let tx=1,ty=1,tl=0;
  if(e.wind>0){
    const k=Math.min(1,(1-e.wind/e.windMax)*1.7);
    if(e.act==='jump'){tx=1+0.25*k;ty=1-0.32*k;}
    else if(e.act==='dash'){tx=1-0.3*k;ty=1+0.14*k;tl=-e.dir*0.18*k;}
    else{tx=1-0.14*k;ty=1+0.06*k;}
  }else if(e.dash>0){tx=1.15;ty=0.9;tl=e.dir*0.08;}
  else if(e.type==='melon'&&!e.onGround&&e.suckT<=0){tx=0.9;ty=1.12;}
  e.sqx+=(tx-e.sqx)*0.3;e.sqy+=(ty-e.sqy)*0.3;e.lean+=(tl-e.lean)*0.3;
}
function updateEnemies(){
  const p=player;
  for(const e of enemies){
    if(e.dead)continue;
    if(!e.active){if(e.x<cam.x+W+60&&e.x+e.w>cam.x-60)e.active=true;else continue;}
    e.t++;if(e.hit>0)e.hit--;if(e.shake>0)e.shake--;
    if(e.suckT>0){e.suckT--;continue;}
    if(e.cool>0)e.cool--;
    if(e.type==='bird'){
      e.y=e.baseY+Math.sin(e.t*0.06)*26;
      if(e.wind>0){if(--e.wind===0)enemyAct(e);}
      else{
        e.x+=e.dir*1.2;
        if((e.x>e.homeX+140&&e.dir>0)||(e.x<e.homeX-140&&e.dir<0))windup(e,'turn',14);
      }
    }else{
      const sp={curry:0.5,anko:1.3,wiener:1.15,rat:1.5,fork:0.75}[e.type];
      if(e.thrown>0)e.thrown--;
      else if(e.wind>0){e.vx=0;if(--e.wind===0)enemyAct(e);}
      else if(e.dash>0){e.dash--;e.vx=e.dir*e.dashSp;if(e.onGround&&e.dash%4===0)dust(e.x+e.w/2-e.dir*e.w/2,e.y+e.h,1,-e.dir);}
      else if(e.type==='melon'){
        if(e.onGround){e.vx*=0.7;if(e.t%70===0){if(!groundAhead(e,24))e.dir*=-1;windup(e,'jump',16);}}
      }else if(e.type==='curry'&&(e.t%240)<50){e.vx=0;if(e.t%240===38)windup(e,'go',12);}
      else{
        e.vx=e.dir*sp;
        if(e.onGround&&(e.type==='anko'||e.type==='rat')&&e.t%170===0&&groundAhead(e,40))windup(e,'dash',20);
        else if(e.onGround&&e.type==='fork'&&e.cool<=0&&playerAhead(e,180))windup(e,'dash',24);
      }
      e.vy=Math.min(e.vy+0.5,10);
      const vx0=e.vx;moveBody(e);
      if(e.hitWall){if(e.thrown>0){e.dir*=-1;e.vx=-vx0;}else if(e.wind<=0){e.dash=0;windup(e,'turn',10);}}
      if(e.onGround){
        if(e.onDough){e.vy=-9;e.onGround=false;}
        else if(e.type!=='melon'&&e.thrown<=0&&e.wind<=0&&!groundAhead(e,2)){e.dash=0;windup(e,'turn',10);}
      }
      if(e.type==='anko')e.rot+=e.vx*0.09;
      if(e.y>ROWS*TS+80)e.dead=true;
    }
    enemyPose(e);
    if(!p.dead&&G.state==='play'){
      if(p.roll>0){const rc=rollCircle();if(circleRect(rc.x,rc.y,rc.r,e)){damageEnemy(e,99,p.face);G.shake=Math.max(G.shake,3);continue;}}
      else if(overlap(phb(),{x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-2})){
        if(e.type!=='fork'&&isStomp(e.y)){damageEnemy(e,3,0,6);stompBounce(e.x+e.w/2,e.y);}
        else hurtPlayer(e.x+e.w/2);
      }
    }
  }
  enemies=enemies.filter(e=>!e.dead);
}

//  ボス：こげこげ大王
// =====================================================================
function bossHB(){const b=boss;return{x:b.x+8,y:b.y+10,w:b.w-16,h:b.h-10};}
function bossVulnerable(){return boss&&!['sleep','intro','dying','gone'].includes(boss.state);}
function setB(s){boss.state=s;boss.t=0;}
function lockArena(){for(let ty=0;ty<14;ty++)lv.t[ty][lv.arenaCol]='L';lv.locked=true;G.shake=8;sfx('thud');}
function arenaPlats(){
  const r=[];if(lv.arenaCol==null)return r;
  for(let ty=0;ty<ROWS;ty++)for(let tx=lv.arenaCol;tx<lv.arenaCol+30;tx++){
    if(tileAt(tx,ty)==='='&&tileAt(tx-1,ty)!=='='){let e=tx;while(tileAt(e+1,ty)==='=')e++;r.push({cx:(tx+e+1)*TS/2,top:ty*TS});}
  }
  return r;
}
function hitBoss(d,inv=14){
  const b=boss;if(!b||b.hit>0||!bossVulnerable())return false;
  b.hp-=d;b.hit=inv;b.sv-=0.1;sfx('bosshit');
  burst(b.x+b.w/2,b.y+b.h/2,['#3a2414','#ff8a3a','#ffd36a'],8,5);popText(b.x+b.w/2,b.y-6,'-'+d,'#ffd36a');
  if(b.hp<=0){
    b.hp=0;setB('dying');stopBGM();
    for(const e of enemies)if(!e.dead)killEnemy(e);
    for(const q of projs)if(!q.friendly)q.dead=true;
    addScore(5000,b.x+b.w/2,b.y-20);G.shake=10;
  }
  return true;
}
// ボスの予備動作ポーズ
function bossPose(angry){
  const b=boss,t=b.t;let tx=1,ty=1,tl=0;
  if(b.state==='jump'){const JW=angry?12:18;if(t<JW&&b.onGround){const k=t/JW;tx=1+0.25*k;ty=1-0.3*k;}}
  else if(b.state==='charge'){if(t<36){const k=Math.min(1,t/24);tx=1-0.28*k;ty=1+0.12*k;tl=-b.dir*0.2*k;}else{tx=1.12;ty=0.92;tl=b.dir*0.1;}}
  else if(b.state==='shoot'){const ph=t<24?t/24:(angry&&t<44?(t-24)/20:0);tx=ty=1+0.16*ph;}
  else if(b.state==='summon'){const k=(t>=13&&t<25)?(t-13)/12:(t>=33&&t<45)?(t-33)/12:0;tx=1+0.15*k;ty=1-0.2*k;}
  b.sqx+=(tx-b.sqx)*0.25;b.sqy+=(ty-b.sqy)*0.25;b.lean+=(tl-b.lean)*0.25;
}
function bossNext(){
  const b=boss,p=player;
  const minions=enemies.filter(e=>!e.dead&&ENEMY[e.type].ability).length;
  const groundAb=items.some(i=>i.type==='ability');
  if(p.form==='plain'&&minions===0&&!groundAb){setB('summon');return;}
  const opts=['jump','charge','shoot','jump'];if(minions<2)opts.push('summon');
  let s=opts[Math.floor(Math.random()*opts.length)];
  if(s===b.last&&Math.random()<0.6)s=opts[(opts.indexOf(s)+1)%opts.length];
  b.last=s;setB(s);
}
function updateBoss(){
  const b=boss;if(!b||b.state==='gone')return;const p=player;
  if(b.state==='sleep'){
    b.t++;
    if(lv.arenaX!=null&&p.x>lv.arenaX+64&&!p.dead){lockArena();setB('intro');playBGM('boss');setBanner('こげこげ大王 が あらわれた！','へんしんパワーで やっつけろ！',150);}
    return;
  }
  b.t++;if(b.hit>0)b.hit--;
  b.sv+=(1-b.s)*0.15;b.sv*=0.85;b.s+=b.sv;
  const angry=b.hp<=b.max/2,bcx=b.x+b.w/2,pcx=p.x+p.w/2;
  switch(b.state){
    case'intro':if(b.t===30){b.s=1.35;b.mouth=1;sfx('roar');G.shake=14;}if(b.t===75)b.mouth=0;if(b.t>100)setB('idle');break;
    case'idle':b.vx*=0.8;b.dir=pcx<bcx?-1:1;if(b.t>(angry?28:50))bossNext();break;
    case'jump':{
      const JW=angry?12:18; // ためる時間（縦にちぢむ）
      b.vx*=b.onGround?0.8:1;
      if(b.t===JW){
        // ねらう着地点：プレイヤーが足場の上ならそこ、ときどき足場、ふだんはプレイヤーの足もと
        const ground=14*TS,plats=arenaPlats();let tx=pcx,ty=ground;
        if(p.onGround&&p.y+p.h<ground-8)ty=p.y+p.h;
        else if(plats.length&&Math.random()<0.45){const pl=plats[Math.floor(Math.random()*plats.length)];tx=pl.cx;ty=pl.top;}
        const v=angry?19:17.5,dy=ty-(b.y+b.h);
        const ft=(v+Math.sqrt(Math.max(0,v*v+1.2*dy)))/0.6;
        b.dropT=ty>=ground?1:0; // 地面ねらいのときは足場をすりぬける
        b.vy=-v;b.vx=clamp((tx-bcx)/ft,-9,9);b.sqx=0.78;b.sqy=1.3;dust(bcx,b.y+b.h,6);
      }
      if(b.t>JW+2&&b.onGround){
        b.dropT=0;b.vx=0;b.sqx=1.3;b.sqy=0.72;G.shake=14;b.s=0.6;sfx('thud');dust(b.x+10,b.y+b.h,6,-1.5);dust(b.x+b.w-10,b.y+b.h,6,1.5);
        if(angry)for(const d of[-1,1])projs.push({type:'ember',x:bcx+d*50,y:b.y+b.h-12,vx:d*4.5,vy:0,r:10,life:120,friendly:false,t:0});
        setB('idle');
      }
      break;}
    case'summon':
      b.vx*=0.8;b.mouth=b.t>=12?1:0;
      if(b.t===25||b.t===45){b.sqx=0.88;b.sqy=1.22;
        const tp=ABILS[Math.floor(Math.random()*4)],D=ENEMY[tp];
        const e=spawnEnemy(tp,bcx+b.dir*30-D.w/2,b.y+20);
        e.vx=b.dir*rand(2.5,4.5);e.vy=-7;e.thrown=40;e.dir=b.dir;e.active=true;sfx('spit');
      }
      if(b.t>65){b.mouth=0;setB('idle');}
      break;
    case'charge':
      if(b.t<36){b.vx*=0.8;b.jit=(b.t%4<2?2:-2);if(b.t===1){b.dir=pcx<bcx?-1:1;sfx('roar');}}
      else{
        b.jit=0;b.vx=b.dir*(angry?8.5:6.5);if(b.t%5===0)dust(bcx-b.dir*40,b.y+b.h,2,-b.dir);
        if(b.hitWall){G.shake=12;sfx('thud');b.vx=-b.dir*3;b.vy=-6;setB('stun');}
        if(b.t>200)setB('idle');
      }
      break;
    case'stun':b.vx*=0.9;if(b.t>(angry?55:85))setB('idle');break;
    case'shoot':
      b.vx*=0.8;b.mouth=b.t>=12?1:0;
      if(b.t===24||(angry&&b.t===44)){b.sqx=0.86;b.sqy=0.9;
        const a0=Math.atan2((p.y+p.h/2)-(b.y+40),pcx-(bcx+b.dir*30));
        for(const k of[-0.28,0,0.28])projs.push({type:'ember',x:bcx+b.dir*34,y:b.y+40,vx:Math.cos(a0+k)*4.5,vy:Math.sin(a0+k)*4.5,r:10,life:160,friendly:false,t:0});
        sfx('shoot');
      }
      if(b.t>64){b.mouth=0;setB('idle');}
      break;
    case'dying':
      b.vx=0;b.mouth=1;
      if(b.t%5===0){burst(b.x+rand(0,b.w),b.y+rand(0,b.h),['#ffd36a','#ff8a3a','#3a2414','#fff'],10,5);sfx('pop');G.shake=6;}
      if(b.t>110){
        b.state='gone';
        for(let i=0;i<5;i++)ring(bcx,b.y+b.h/2,['#fff','#ffd36a','#ff8a3a'][i%3],40+i*20);
        sparkle(bcx,b.y+b.h/2,24);
        goal={x:lv.arenaX+15*TS,y:14*TS,appear:0};
        sfx('transform');setBanner('こげこげ大王を やっつけた！','ゴールの かごへ いこう！',170);playBGM('s3');
      }
      return;
  }
  bossPose(angry);
  b.vy=Math.min(b.vy+0.6,12);moveBody(b);
  if(!p.dead&&b.state!=='intro'){
    const hb=bossHB();
    if(p.roll>0){
      const rc=rollCircle();
      if(circleRect(rc.x,rc.y,rc.r,hb)){
        hitBoss(4,20);p.roll=0;p.rollCd=25;p.hurtT=14;p.vx=(pcx<bcx?-1:1)*6;p.vy=-7;p.inv=Math.max(p.inv,30);G.shake=8;
      }
    }else if(overlap(phb(),hb)){
      if(isStomp(hb.y+6)){hitBoss(2,20);stompBounce(pcx,hb.y,-11);}
      else hurtPlayer(bcx);
    }
  }
}

function updateProjs(){
  const p=player;
  for(const q of projs){
    if(q.dead)continue;
    q.t++;
    if(q.type==='fire'){
      q.x+=q.vx;q.y+=q.vy;q.vx*=0.94;q.vy-=0.03;q.r+=0.6;q.life--;
      if(q.life<=0)q.dead=true;
      if(isSolid(tileAtP(q.x,q.y))){breakAt(q.x,q.y,12);q.life=Math.min(q.life,2);}
      if(q.t%4===0)addP({type:'smoke',x:q.x,y:q.y,vx:0,vy:-0.6,life:14,size:3,color:'rgba(120,80,60,0.4)'});
    }else if(q.type==='boomer'){
      q.ang+=0.45;
      if(q.t<32){q.x+=q.vx;q.vx*=0.965;}
      else{
        const dx=p.x+p.w/2-q.x,dy=p.y+p.h/2-q.y,d=Math.hypot(dx,dy)||1,s=Math.min(14,5+(q.t-32)*0.25);
        q.x+=dx/d*s;q.y+=dy/d*s;if(d<24||q.t>240||p.dead)q.dead=true;
      }
      breakAt(q.x,q.y,q.r-3);
      if(q.t%3===0)addP({type:'star',x:q.x,y:q.y,life:12,size:4,color:'#fff3b0'});
    }else if(q.type==='star'){
      q.x+=q.vx;q.y+=q.vy;q.life--;
      if(q.t%2===0)addP({type:'star',x:q.x-Math.sign(q.vx)*10,y:q.y+rand(-6,6),vx:-q.vx*0.1,life:16,size:rand(4,7),color:'#fff6b0'});
      const fx=q.x+Math.sign(q.vx)*q.r;
      if(isSolid(tileAtP(fx,q.y))){breakAt(fx,q.y,8);sparkle(q.x,q.y,8);ring(q.x,q.y,'#fff',22);q.dead=true;}
      if(q.life<=0){sparkle(q.x,q.y,6);q.dead=true;}
    }else if(q.type==='ember'){
      q.x+=q.vx;q.y+=q.vy;q.life--;
      if(q.t%3===0)addP({type:'dot',x:q.x,y:q.y,vx:rand(-0.5,0.5),vy:rand(-1,0),life:14,size:3,color:'#ff9a3a'});
      if(q.life<=0||isSolid(tileAtP(q.x,q.y))){q.dead=true;burst(q.x,q.y,['#ff8a3a','#ffd36a'],6,3);}
    }
    if(q.dead)continue;
    if(q.friendly){
      const dmg={fire:1,boomer:2,star:5}[q.type],inv={fire:6,boomer:14,star:10}[q.type];
      for(const e of enemies){
        if(e.dead||!e.active||e.suckT>0)continue;
        if(circleRect(q.x,q.y,q.r,e)){
          if(damageEnemy(e,dmg,Math.sign(q.vx)||p.face,inv)&&q.type==='star'){q.dead=true;sparkle(q.x,q.y,8);break;}
        }
      }
      if(!q.dead&&bossVulnerable()&&circleRect(q.x,q.y,q.r,bossHB())){
        hitBoss(dmg,q.type==='fire'?7:16);
        if(q.type==='star'){q.dead=true;sparkle(q.x,q.y,10);ring(q.x,q.y,'#fff',26);}
      }
    }else if(!p.dead&&circleRect(q.x,q.y,q.r*0.8,phb())){hurtPlayer(q.x);q.dead=true;}
  }
  projs=projs.filter(q=>!q.dead);
}
function updateItems(){
  const p=player,hb=phb();
  for(const it of items){
    if(it.dead)continue;
    it.t++;
    if(it.suckT>0)it.suckT--;
    else if(it.type==='ability'){
      if(it.delay>0)it.delay--;
      it.vy=Math.min(it.vy+0.35,8);const vx0=it.vx;moveBody(it);
      if(it.hitWall)it.vx=-vx0*0.8;
      if(it.onGround){if(it.bounce<-1.2){it.vy=it.bounce;it.bounce*=0.6;}it.vx*=0.92;}
      if(--it.life<=0||it.y>ROWS*TS+40){it.dead=true;dust(it.x+11,it.y+11,6);continue;}
    }
    if(!p.dead&&overlap(it,hb)){
      if(it.type==='ability'){if(p.form==='plain'&&it.delay<=0){it.dead=true;transform(it.ab);}}
      else collect(it);
    }
  }
  items=items.filter(i=>!i.dead);
}
function updateObjs(){
  const p=player;if(p.dead)return;
  const pcx=p.x+p.w/2;
  for(const k of checks){
    if(!k.on&&Math.abs(pcx-k.x)<22&&p.y+p.h>k.y-80&&p.y<k.y){
      k.on=true;G.cp={x:k.x,y:k.y};sfx('check');sparkle(k.x,k.y-60,12,'#ffe27a');popText(k.x,k.y-90,'チェックポイント！','#fff');
      if(p.hp<G.maxHp)p.hp=G.maxHp;
    }
  }
  if(goal){
    if(goal.appear!=null&&goal.appear<30)goal.appear++;
    else if(overlap(phb(),{x:goal.x-40,y:-400,w:80,h:goal.y+400}))stageClear();
  }
  for(const k in lv.wob){lv.wob[k]*=0.92;if(lv.wob[k]<0.02)delete lv.wob[k];}
}
function stageClear(){
  const p=player;G.state='clear';G.clearT=0;p.roll=0;p.whip=0;p.vx=0;
  stopBGM();sfx('fanfare');
  const bonus=1000+p.hp*200;G.score+=bonus;G.clearBonus=bonus;
  for(let i=0;i<70;i++)addP({type:'conf',x:cam.x+rand(0,W),y:cam.y-rand(0,120),vx:rand(-1,1),vy:rand(1,3),life:(rand(140,220))|0,size:rand(4,7),
    color:['#ff6a6a','#ffd36a','#7ad0ff','#9ad46e','#ffa8d8'][i%5],g:0.02,drag:0.995,rot:rand(0,6),vr:rand(-0.2,0.2)});
}
function updateClear(){
  const p=player;G.clearT++;
  p.vx*=0.8;p.vy=Math.min(p.vy+0.55,10);moveBody(p);
  if(p.onGround&&G.clearT>30&&G.clearT%45===0){p.vy=-8;p.s=1.3;p.sv=0;sfx('jump');}
  springPlayer();p.face=1;p.walkT=0;
  if((G.clearT>150&&(P.start||P.jump||P.act))||G.clearT>360){
    if(G.stage<STAGES.length-1){G.cp=null;loadStage(G.stage+1);}
    else{G.state='ending';G.endT=0;playBGM('title');}
  }
}
function updateParticles(){
  for(const q of parts){
    q.life--;
    if(q.type!=='wind'){q.vy+=q.g;q.vx*=q.drag;q.vy*=q.drag;q.x+=q.vx;q.y+=q.vy;}
    if(q.rot!=null)q.rot+=q.vr||0;
  }
  parts=parts.filter(q=>q.life>0);
  if(parts.length>800)parts.splice(0,parts.length-800);
}
function updateCamera(){
  const p=player;
  if(lv.locked){cam.minX=cam.maxX=lv.arenaX;}
  const tx=clamp(p.x+p.w/2-W/2+p.face*60,cam.minX,cam.maxX);
  cam.x+=(tx-cam.x)*0.1;
}

const PAUSE_BTN={x:W/2-56,y:10,w:112,h:36};
const PAUSE_ITEMS=['つづける','ステージの さいしょから','タイトルへ もどる'];
function inRect(pt,r){return pt.x>=r.x&&pt.x<=r.x+r.w&&pt.y>=r.y&&pt.y<=r.y+r.h;}
function menuRect(i){return{x:W/2-170,y:H/2-46+i*62,w:340,h:50};}
function updatePauseMenu(){
  const n=PAUSE_ITEMS.length;let choose=-1;
  if(PK.up){G.psel=(G.psel+n-1)%n;sfx('sel');}
  if(PK.down){G.psel=(G.psel+1)%n;sfx('sel');}
  if(PK.ok)choose=G.psel;
  if(G.click)for(let i=0;i<n;i++)if(inRect(G.click,menuRect(i)))choose=i;
  if(choose<0)return;
  G.paused=false;sfx('pause');
  if(choose===1){G.cp=null;loadStage(G.stage);}
  else if(choose===2){G.state='title';playBGM('title');}
}
function update(){
  G.t++;
  if(P.mute){muted=!muted;}
  if(G.state==='title'){if(G.t%2===0)updateParticles();if(P.start||P.jump){audioInit();startGame();}return;}
  if(G.state==='ending'){G.endT++;updateParticles();
    if(G.endT%30===0)sparkle(rand(100,W-100),rand(80,300),6,['#ffe27a','#ffb0c0','#b0e0ff'][G.endT/30%3|0]);
    if(G.endT>90&&(P.start||P.jump)){G.state='title';playBGM('title');}return;}
  if(G.state==='play'){
    const btn=G.click&&inRect(G.click,PAUSE_BTN);
    if(P.pause||btn){G.paused=!G.paused;G.psel=0;sfx('pause');if(btn)G.click=null;}
    else if(G.paused)updatePauseMenu();
  }
  if(G.paused)return;
  if(G.banner&&--G.banner.t<=0)G.banner=null;
  G.shake=G.shake>0.5?G.shake*0.85:0;
  if(G.flash>0)G.flash=Math.max(0,G.flash-0.06);
  if(G.freeze>0){G.freeze--;springPlayer();updateParticles();return;}
  if(G.state==='clear'){updateClear();updateParticles();updateCamera();return;}
  updatePlayer();
  if(G.state!=='play')return;
  updateEnemies();updateBoss();updateProjs();updateItems();updateObjs();updateParticles();updateCamera();
}

function bunPath(c,rx,h){
  c.beginPath();
  c.moveTo(-rx*0.78,0);
  c.quadraticCurveTo(-rx*1.04,0,-rx,-h*0.32);
  c.bezierCurveTo(-rx,-h*1.23,rx,-h*1.23,rx,-h*0.32);
  c.quadraticCurveTo(rx*1.04,0,rx*0.78,0);
  c.closePath();
}
function domeY(x,rx,h){const k=x/rx;return -h*(1-k*k*0.62);}
function drawFace(c,rx,h,o){
  const fd=o.face||1,fx=fd*rx*(o.mouth==='big'?0.24:0.16),ey=-h*0.52,ex=rx*0.3,dark='#3b200c';
  c.fillStyle=dark;c.strokeStyle=dark;c.lineWidth=1.8;c.lineCap='round';
  if(o.dead){
    for(const k of[-1,1]){const x=fx+k*ex;c.beginPath();c.moveTo(x-2.6,ey-2.6);c.lineTo(x+2.6,ey+2.6);c.moveTo(x+2.6,ey-2.6);c.lineTo(x-2.6,ey+2.6);c.stroke();}
  }else if(o.hurt){
    for(const k of[-1,1]){const x=fx+k*ex;c.beginPath();c.moveTo(x-k*2.8,ey-2.8);c.lineTo(x+k*1.6,ey);c.lineTo(x-k*2.8,ey+2.8);c.stroke();}
  }else if(o.blink||o.happy){
    for(const k of[-1,1]){c.beginPath();if(o.happy)c.arc(fx+k*ex,ey+1.5,2.8,Math.PI*1.1,Math.PI*1.9);else c.arc(fx+k*ex,ey-1,2.8,Math.PI*0.15,Math.PI*0.85);c.stroke();}
  }else{
    for(const k of[-1,1]){c.beginPath();c.ellipse(fx+k*ex,ey,2.5,3.5,0,0,7);c.fill();}
    c.fillStyle='#fff';for(const k of[-1,1]){c.beginPath();c.arc(fx+k*ex-0.8,ey-1.3,0.95,0,7);c.fill();}
  }
  c.fillStyle='rgba(255,105,105,0.5)';
  for(const k of[-1,1]){c.beginPath();c.ellipse(fx+k*ex*1.7,ey+h*0.19,3.8,2.3,0,0,7);c.fill();}
  const my=ey+h*0.25;
  if(o.mouth==='big'){
    c.fillStyle='#6a1a10';c.beginPath();c.ellipse(fx+fd*2,my+1,6.5,7.5,0,0,7);c.fill();
    c.fillStyle='#ff8a8a';c.beginPath();c.ellipse(fx+fd*2,my+5,4,2.5,0,0,7);c.fill();
  }else if(o.mouth==='open'){
    c.fillStyle='#6a1a10';c.beginPath();c.ellipse(fx,my,3.6,3.8,0,0,7);c.fill();
  }else{
    c.strokeStyle=dark;c.lineWidth=1.5;c.beginPath();
    c.arc(fx-2,my-0.8,2,0.1*Math.PI,0.95*Math.PI);c.moveTo(fx+4,my-0.8);c.arc(fx+2,my-0.8,2,0.05*Math.PI,0.9*Math.PI);c.stroke();
  }
}
function drawBread(c,form,o={}){
  const B=BREAD[form],rx=B.rx,h=B.h;
  if(form==='wiener'){
    const sg=c.createLinearGradient(0,-h*0.62,0,-h*0.22);sg.addColorStop(0,'#e8664c');sg.addColorStop(1,'#9a2e1e');
    rr(c,-rx-9,-h*0.6,rx*2+18,h*0.4,h*0.2);c.fillStyle=sg;c.fill();c.lineWidth=2;c.strokeStyle='#5a1a10';c.stroke();
    c.fillStyle='rgba(255,255,255,0.35)';rr(c,-rx-5,-h*0.56,8,3,1.5);c.fill();rr(c,rx-2,-h*0.56,8,3,1.5);c.fill();
  }
  bunPath(c,rx,h);
  const g=c.createLinearGradient(0,-h,0,0);g.addColorStop(0,B.top);g.addColorStop(0.55,B.mid);g.addColorStop(1,B.bot);
  c.fillStyle=g;c.fill();
  c.save();c.clip();
  if(form==='curry'){
    for(const[a,b,s]of CRUMB_PTS){c.fillStyle=s<0.5?'rgba(255,225,160,0.85)':'rgba(110,50,12,0.55)';c.beginPath();c.arc((a*2-1)*rx,-b*h*1.05,1.2+s*1.5,0,7);c.fill();}
  }else if(form==='melon'){
    c.strokeStyle='rgba(176,132,40,0.55)';c.lineWidth=1.4;c.beginPath();
    for(let d=-50;d<=50;d+=9){c.moveTo(d-18,-h-3);c.lineTo(d+18,3);c.moveTo(d+18,-h-3);c.lineTo(d-18,3);}
    c.stroke();
    c.fillStyle='rgba(255,255,255,0.9)';for(let i=0;i<16;i++){const[a,b]=CRUMB_PTS[i];c.fillRect((a*2-1)*rx,-b*h,1.4,1.4);}
  }else if(form==='anko'){
    c.fillStyle='rgba(60,20,5,0.35)';c.beginPath();c.ellipse(0,-h*0.93,4.5,2.4,0,0,7);c.fill();
  }
  c.fillStyle='rgba(255,255,255,0.36)';c.beginPath();c.ellipse(-rx*0.42,-h*0.76,rx*0.28,h*0.13,-0.5,0,7);c.fill();
  if(form==='anko'){c.fillStyle='rgba(255,255,255,0.22)';c.beginPath();c.ellipse(rx*0.35,-h*0.7,rx*0.12,h*0.08,0.5,0,7);c.fill();}
  if(o.burnt){c.fillStyle='rgba(40,18,8,0.65)';c.fillRect(-rx*2,-h*2,rx*4,h*2.2);}
  c.restore();
  bunPath(c,rx,h);c.lineWidth=2.2;c.strokeStyle=B.line;c.lineJoin='round';c.stroke();
  if(form==='anko'){
    c.fillStyle='#fffbe8';for(const[sx,sy,r]of[[-3,-h+1.5,0.3],[0,-h+0.5,-0.2],[3,-h+1.8,0.5],[-1.5,-h+3.5,0.1],[1.8,-h+3.6,-0.4]]){c.beginPath();c.ellipse(sx,sy,1.5,0.9,r,0,7);c.fill();}
  }
  if(form==='wiener'){
    c.lineCap='round';c.lineJoin='round';
    const zig=(col,lw,off)=>{c.strokeStyle=col;c.lineWidth=lw;c.beginPath();for(let i=0;i<=8;i++){const x=-rx*0.62+i*rx*0.155;const y=domeY(x,rx,h)+3+(i%2?3.2:-0.8)+off;i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();};
    zig('#d8261c',3.2,0);zig('#ffd23a',1.5,2.2);
  }
  if(form==='curry'&&o.fire){c.fillStyle='rgba(255,140,40,0.5)';}
  drawFace(c,rx,h,o);
}
function drawPlayer(){
  const p=player,f=p.form,B=BREAD[f];
  if(p.inv>0&&!p.dead&&Math.floor(p.inv/4)%2===0&&G.state==='play')ctx.globalAlpha=0.45;
  const cx=p.x+p.w/2,by=p.y+p.h;
  let sy=p.s,sx=1+(1-p.s)*0.85,hop=0;
  if(p.onGround&&p.walkT>0){const ph=Math.sin(p.walkT);hop=Math.abs(ph)*6;const sq=1-Math.max(0,0.35-Math.abs(ph))*0.5;sy*=sq;sx/=sq;}
  if(p.onGround&&Math.abs(p.vx)<=0.3&&!p.dead){const b=Math.sin(G.t*0.09)*0.035;sy*=1+b;sx*=1-b;}
  if(p.inhaling){sx*=1.12+Math.sin(G.t*0.8)*0.02;sy*=0.95;}
  // かげ
  if(p.onGround&&!p.dead){ctx.fillStyle='rgba(60,30,10,0.18)';ctx.beginPath();ctx.ellipse(cx,by+1,B.rx*p.big*(1-hop*0.03),3.2,0,0,7);ctx.fill();}
  // むち
  if(p.whip>0&&f==='wiener')drawWhip(p);
  ctx.save();ctx.translate(cx,by-hop);
  if(p.dead){ctx.translate(0,-B.h/2);ctx.rotate(p.rot);ctx.translate(0,B.h/2);}
  if(p.big>1.02||p.roll>0){const k=p.big;ctx.translate(0,-B.h*0.5*k);ctx.rotate(p.rot);ctx.scale(k,k);ctx.translate(0,B.h*0.5);}
  ctx.scale(sx,sy);
  const breathing=f==='curry'&&K.act&&!p.needRelease&&G.state==='play';
  let mouth='smile';if(p.inhaling)mouth='big';else if(breathing||p.whip>0||(f==='plain'&&!p.onGround&&p.floating))mouth='open';
  drawBread(ctx,f,{face:p.face,mouth,blink:p.blinkT<0,hurt:p.hurtT>0,dead:p.dead,burnt:p.dead,happy:G.state==='clear'});
  ctx.restore();
  ctx.globalAlpha=1;
  if(p.roll>0&&p.onGround){ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=3;for(let i=0;i<3;i++){const yy=by-10-i*14;ctx.beginPath();ctx.moveTo(cx-p.face*(30+i*6),yy);ctx.lineTo(cx-p.face*(50+i*8),yy);ctx.stroke();}}
}
function drawWhip(p){
  const{pts,a}=whipPts(p);
  ctx.save();
  for(let i=0;i<pts.length;i++){
    const pt=pts[i],last=i===pts.length-1,rx=last?16:9,ry=last?9:6;
    ctx.beginPath();ctx.ellipse(pt.x,pt.y,rx,ry,a*p.face,0,7);
    ctx.fillStyle=last?'#d0503a':'#c2402c';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#5a1a10';ctx.stroke();
    if(last){ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.ellipse(pt.x,pt.y-2,5,1.6,a*p.face,0,7);ctx.fill();}
  }
  ctx.restore();
}

// ---------- 具材アイコン ----------
function drawIngredient(c,ab,x,y,s=1){
  c.save();c.translate(x,y);c.scale(s,s);
  if(ab==='curry'){ell(c,0,0,10,8,'#c8701e','#5a2a0c',1.5);ell(c,-3,-1,3,2,'#ff8c2a');ell(c,3,2,3,2.4,'#f5dc8c');ell(c,-3,-4,3,1.4,'rgba(255,255,255,.5)');}
  else if(ab==='anko'){ell(c,0,0,9,8,'#5a2030','#2a0a10',1.5);c.strokeStyle='#fff';c.lineWidth=1.6;c.beginPath();c.moveTo(-3,-5);c.quadraticCurveTo(0,-7,3,-5);c.stroke();}
  else if(ab==='melon'){ell(c,0,0,9,9,'#8fd06a','#3e7e2e',1.5);c.strokeStyle='rgba(230,250,200,.8)';c.lineWidth=1;c.beginPath();c.ellipse(0,0,4,9,0,0,7);c.ellipse(0,0,9,4,0,0,7);c.stroke();}
  else if(ab==='wiener'){rr(c,-11,-5,22,10,5);c.fillStyle='#c8442e';c.fill();c.strokeStyle='#5a1a10';c.lineWidth=1.5;c.stroke();c.fillStyle='rgba(255,255,255,.4)';rr(c,-7,-3,10,2,1);c.fill();}
  c.restore();
}

// ---------- 敵の描画 ----------
function eyes(c,x,y,gap,s=1,angry=false){
  c.fillStyle='#2a160a';for(const k of[-1,1]){c.beginPath();c.ellipse(x+k*gap,y,2.2*s,3*s,0,0,7);c.fill();}
  c.fillStyle='#fff';for(const k of[-1,1]){c.beginPath();c.arc(x+k*gap-0.7*s,y-1.1*s,0.8*s,0,7);c.fill();}
  if(angry){c.strokeStyle='#2a160a';c.lineWidth=1.6;c.lineCap='round';for(const k of[-1,1]){c.beginPath();c.moveTo(x+k*(gap+3.2*s),y-6*s);c.lineTo(x+k*(gap-2.4*s),y-3.6*s);c.stroke();}}
}
function drawEnemy(e){
  if(e.x>cam.x+W+60||e.x+e.w<cam.x-60)return;
  const c=ctx,d=e.dir,t=e.t;c.save();
  let x=e.x+e.w/2,y=e.y+e.h;if(e.shake>0)x+=rand(-2,2);
  c.translate(x,y);
  if(e.hit>0&&e.hit%4<2)c.globalAlpha=0.45;
  if(e.suckT>0){c.translate(0,-e.h/2);c.rotate(Math.sin(G.t*0.9)*0.3);c.scale(0.85,1.1);c.translate(0,e.h/2);}
  if(e.wind>0&&e.act==='dash'&&e.wind<8)c.translate(rand(-1,1),0);
  c.rotate(e.lean);c.scale(e.sqx,e.sqy);
  switch(e.type){
    case'curry':{
      const sq=1+Math.sin(t*0.15)*0.07;c.scale(1/sq,sq);
      const g=c.createLinearGradient(0,-22,0,0);g.addColorStop(0,'#e48e36');g.addColorStop(1,'#a8501a');
      c.beginPath();c.moveTo(-15,0);c.bezierCurveTo(-17,-12,-11,-21,-4,-20);c.bezierCurveTo(0,-25,8,-23,9,-18);c.bezierCurveTo(15,-16,17,-6,15,0);c.closePath();
      c.fillStyle=g;c.fill();c.strokeStyle='#5a2a0c';c.lineWidth=2;c.stroke();
      c.fillStyle='#ff8c2a';rr(c,-12,-9,7,5,2);c.fill();c.fillStyle='#f5dc8c';rr(c,6,-7,7,6,2);c.fill();
      ell(c,-1,-4,1.8,1.8,'#7a3a12');ell(c,-6,-16,4,2,'rgba(255,255,255,.4)',null,0,-0.3);
      eyes(c,d*3,-13,4.5);
      c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;c.lineCap='round';
      for(const k of[-4,5]){c.beginPath();for(let i=0;i<=6;i++){const yy=-25-i*2.4,xx=k+Math.sin(i*0.9+t*0.12+k)*2.2;i?c.lineTo(xx,yy):c.moveTo(xx,yy);}c.stroke();}
      break;}
    case'anko':{
      const g=c.createRadialGradient(-4,-17,2,0,-12,13);g.addColorStop(0,'#9a5050');g.addColorStop(1,'#4a1824');
      ell(c,0,-12,12.5,12,g,'#2a0a10',2);
      c.save();c.translate(0,-12);c.rotate(e.rot);c.strokeStyle='#fff';c.lineWidth=2.2;c.lineCap='round';c.beginPath();c.moveTo(-4,-8.5);c.quadraticCurveTo(0,-10.5,4,-8.5);c.stroke();c.restore();
      ell(c,-5,-18,3.5,2,'rgba(255,255,255,.35)',null,0,-0.5);
      eyes(c,d*2.5,-11,4.2);
      break;}
    case'melon':{
      const g=c.createRadialGradient(-4,-17,2,0,-12,13);g.addColorStop(0,'#c5ef9a');g.addColorStop(1,'#5a9a3c');
      ell(c,0,-12,12,12,g,'#2e6a22',2);
      c.strokeStyle='rgba(235,255,210,.75)';c.lineWidth=1.1;c.beginPath();c.ellipse(0,-12,4.5,11.5,0,0,7);c.ellipse(0,-12,9,11.5,0,0,7);c.ellipse(0,-12,11.5,5,0,0,7);c.stroke();
      c.strokeStyle='#7a5a2a';c.lineWidth=2.2;c.beginPath();c.moveTo(0,-24);c.lineTo(0,-28);c.moveTo(-3,-28);c.lineTo(3,-28);c.stroke();
      ell(c,5,-26,4,2,'#6ab84a',null,0,-0.4);
      eyes(c,d*2.5,-11,4.2);
      break;}
    case'wiener':{
      for(let i=0;i<4;i++){const lx=-10+i*6.6,ly=Math.sin(t*0.35+i*1.6)*1.6;c.strokeStyle='#9a2e1e';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(lx,-4);c.lineTo(lx+d*1.5,-0.5+ly*0.5);c.stroke();}
      const g=c.createLinearGradient(0,-17,0,-4);g.addColorStop(0,'#ec6a50');g.addColorStop(1,'#a8301e');
      rr(c,-15,-17,30,13,6.5);c.fillStyle=g;c.fill();c.strokeStyle='#5a1a10';c.lineWidth=2;c.stroke();
      c.strokeStyle='rgba(255,210,190,.8)';c.lineWidth=1.4;for(const k of[0,4]){c.beginPath();c.moveTo(-d*(10-k),-15);c.lineTo(-d*(7-k),-8);c.stroke();}
      c.fillStyle='rgba(255,255,255,.4)';rr(c,-8,-15.5,14,2.4,1.2);c.fill();
      eyes(c,d*7,-11,3.6,0.85);
      break;}
    case'rat':{
      c.strokeStyle='#d58a9a';c.lineWidth=2;c.lineCap='round';c.beginPath();c.moveTo(-d*12,-5);c.quadraticCurveTo(-d*22,-4+Math.sin(t*0.2)*3,-d*22,-14);c.stroke();
      for(const k of[-6,5]){ell(c,k+Math.sin(t*0.4+k)*1.5,-1,3,1.8,'#8a8a98');}
      ell(c,0,-8,14,8.5,'#a8a8b8','#5a5a6a',2);
      ell(c,d*4,-15,4.8,4.8,'#a8a8b8','#5a5a6a',1.5);ell(c,d*4,-15,2.6,2.6,'#f2a8b8');
      ell(c,d*14,-8,2.2,2.2,'#f07890');
      ell(c,d*8,-10,1.8,2.4,'#2a160a');
      c.strokeStyle='rgba(60,60,70,.6)';c.lineWidth=0.8;c.beginPath();c.moveTo(d*13,-7);c.lineTo(d*19,-9);c.moveTo(d*13,-7);c.lineTo(d*19,-5);c.stroke();
      break;}
    case'bird':{
      ell(c,-d*10,-11,5,2.6,'#7a4a22',null,0,d*0.4);
      ell(c,0,-10,10,9.5,'#a8743c','#5a3414',1.8);
      ell(c,d*2,-6,6.5,5,'#f6e4c0');
      ell(c,-d*1,-12,7,4,'#7a4a22',null,0,Math.sin(t*0.45)*0.7*d);
      c.fillStyle='#ffa030';c.beginPath();c.moveTo(d*9,-13);c.lineTo(d*14,-11);c.lineTo(d*9,-9);c.closePath();c.fill();
      ell(c,d*5,-13,1.8,2.2,'#2a160a');
      break;}
    case'fork':{
      for(const k of[-4,4])ell(c,k,-1,3.5,2,'#6a7480');
      const g=c.createLinearGradient(-4,0,4,0);g.addColorStop(0,'#f4f8fc');g.addColorStop(1,'#8a96a4');
      rr(c,-3.5,-22,7,21,3);c.fillStyle=g;c.fill();c.strokeStyle='#4a5460';c.lineWidth=1.5;c.stroke();
      for(let i=0;i<4;i++){rr(c,-8.5+i*4.6,-44,3,14,1.5);c.fillStyle=g;c.fill();c.stroke();}
      rr(c,-10,-33,20,11,4);c.fillStyle=g;c.fill();c.stroke();
      eyes(c,d*1.5,-27.5,4,0.75,true);
      break;}
  }
  c.restore();
}

// ---------- ボス描画 ----------
function drawBoss(){
  const b=boss;if(!b||b.state==='gone')return;const c=ctx;
  const bcx=b.x+b.w/2;
  c.save();c.translate(bcx+(b.jit||0),b.y+b.h);
  if(b.state==='dying'){const k=Math.max(0.05,1-b.t/110);c.scale(k,k);c.rotate(Math.sin(b.t*0.6)*0.15);}
  const sy=b.s,sx=1+(1-b.s)*0.8;c.rotate(b.lean||0);c.scale(sx*(b.sqx||1),sy*(b.sqy||1));
  if(b.hit>0&&b.hit%4<2)c.globalAlpha=0.55;
  const rx=50,h=88,fd=b.dir*6;

    for(let x=-((o2)%14);x<W;x+=14){const yy=395+Math.sin((x+o2)*0.007)*22;c.beginPath();c.moveTo(x,yy+8);c.lineTo(x+Math.sin(G.t*0.03+x)*2,yy-12);c.stroke();ell(c,x+Math.sin(G.t*0.03+x)*2,yy-14,2.4,5,'#e8a838');}
  }else{
    g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0806');g.addColorStop(0.6,'#4a170d');g.addColorStop(1,'#7a2a12');c.fillStyle=g;c.fillRect(0,0,W,H);
    const o0=cx*0.15;c.strokeStyle='rgba(255,120,60,0.07)';c.lineWidth=2;
    for(let y=0;y<H;y+=28){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();const off=((y/28)%2)*40;for(let x=-((o0+off)%80);x<W;x+=80){c.beginPath();c.moveTo(x,y);c.lineTo(x,y+28);c.stroke();}}
    const o1=cx*0.25;
    for(let i=Math.floor(o1/320)-1;i<=Math.floor((o1+W)/320)+1;i++){
      const x=i*320-o1+80;
      const ag=c.createLinearGradient(0,150,0,340);ag.addColorStop(0,'rgba(255,150,60,0.55)');ag.addColorStop(1,'rgba(255,80,30,0.15)');
      c.fillStyle=ag;c.beginPath();c.moveTo(x,340);c.lineTo(x,200);c.arc(x+45,200,45,Math.PI,0);c.lineTo(x+90,340);c.fill();
      c.strokeStyle='rgba(30,10,5,0.8)';c.lineWidth=4;for(let k=1;k<4;k++){c.beginPath();c.moveTo(x+k*22.5,160);c.lineTo(x+k*22.5,340);c.stroke();}
    }
    const o2=cx*0.4;c.fillStyle='#240c08';
    for(let i=Math.floor(o2/360)-1;i<=Math.floor((o2+W)/360)+1;i++){const x=i*360-o2+250;c.fillRect(x,0,44,H);c.fillStyle='#3a160e';c.fillRect(x+4,0,6,H);c.fillStyle='#240c08';}
    for(let i=0;i<40;i++){
      const x=((i*137-cx*0.5+Math.sin(G.t*0.01+i)*20)%W+W)%W,y=H-((G.t*(0.5+(i%5)*0.15)+i*53)%(H+40));
      c.fillStyle=`rgba(255,${120+(i%4)*30},40,${0.4+(i%3)*0.2})`;c.beginPath();c.arc(x,y,1.5+(i%3),0,7);c.fill();
    }
    const bg=c.createLinearGradient(0,H-180,0,H);bg.addColorStop(0,'rgba(255,90,30,0)');bg.addColorStop(1,'rgba(255,90,30,0.35)');c.fillStyle=bg;c.fillRect(0,H-180,W,180);
  }
}

// ---------- タイル ----------
function drawTiles(){
  const th=G.theme,c=ctx;
  const c0=Math.max(0,Math.floor(cam.x/TS)-1),c1=Math.min(lv.w-1,Math.floor((cam.x+W)/TS)+1);
  for(let ty=0;ty<ROWS;ty++)for(let tx=c0;tx<=c1;tx++){
    const t=lv.t[ty][tx];if(t==='.')continue;
    const x=tx*TS,y=ty*TS;
    if(t==='#')drawGround(x,y,tx,ty,th);
    else if(t==='='){
      if(tx===c0||tileAt(tx-1,ty)!=='='){
        let s=tx;while(tileAt(s-1,ty)==='=')s--;let e=tx;while(tileAt(e+1,ty)==='=')e++;
        const bx=s*TS+1,bw=(e-s+1)*TS-2;
        const g=c.createLinearGradient(0,y,0,y+16);g.addColorStop(0,'#c27028');g.addColorStop(0.5,'#e8a050');g.addColorStop(1,'#f6cf8a');
        rr(c,bx,y+1,bw,16,8);c.fillStyle=g;c.fill();c.lineWidth=2;c.strokeStyle='#7a3e12';c.stroke();
        c.strokeStyle='#fbe2b0';c.lineWidth=2.5;c.lineCap='round';
        for(let k=bx+14;k<bx+bw-10;k+=24){c.beginPath();c.moveTo(k-4,y+11);c.quadraticCurveTo(k,y+4,k+6,y+4);c.stroke();}
      }
    }else if(t==='B'){
      rr(c,x+1,y+1,TS-2,TS-2,5);c.fillStyle='#efcf92';c.fill();c.lineWidth=2;c.strokeStyle='#b07e40';c.stroke();
      c.fillStyle='#fff3d0';c.fillRect(x+5,y+4,TS-10,3);
      c.fillStyle='#c79a5a';for(const[dx,dy]of[[10,12],[22,12],[10,23],[22,23],[16,17.5]]){c.beginPath();c.arc(x+dx,y+dy,1.8,0,7);c.fill();}
    }else if(t==='~'){
      const top=tileAt(tx,ty-1)!=='~';
      const g=c.createLinearGradient(0,y,0,y+TS);g.addColorStop(0,'#fff6e2');g.addColorStop(1,'#f2d8a8');
      c.fillStyle=g;
      if(top){
        const wb=(lv.wob[tx]||0),dip=Math.sin(G.t*0.5)*wb*7+wb*5;
        c.beginPath();c.moveTo(x,y+TS);c.lineTo(x,y+6);c.quadraticCurveTo(x+TS/2,y-4+dip,x+TS,y+6);c.lineTo(x+TS,y+TS);c.closePath();c.fill();
        c.strokeStyle='#d8b078';c.lineWidth=2;c.beginPath();c.moveTo(x,y+6);c.quadraticCurveTo(x+TS/2,y-4+dip,x+TS,y+6);c.stroke();
        ell(c,x+10,y+6+dip*0.5,4,1.6,'rgba(255,255,255,.7)');
      }else{c.fillRect(x,y,TS,TS);}
    }else if(t==='L'){
      c.fillStyle='#2a1a14';c.fillRect(x,y,TS,TS);c.fillStyle='#6a5a50';c.fillRect(x+6,y,5,TS);c.fillRect(x+20,y,5,TS);
      c.fillStyle='#ff8a3a';c.fillRect(x,y+TS-3,TS,1);
    }
  }
}
function drawGround(x,y,tx,ty,th){
  const c=ctx,ab=tileAt(tx,ty-1),top=!(ab==='#'||ab==='L'),h=hash(tx,ty),h2=hash(tx+7,ty+3);
  if(th===0){
    c.fillStyle='#a8662e';c.fillRect(x,y,TS,TS);
    c.fillStyle='#93562a';c.fillRect(x,y+6+((h*18)|0),TS,2);if(tx%4===0)c.fillRect(x,y,2,TS);
    if(h2>0.8){ell(c,x+8+h*16,y+20,3,2,'#8a4e24');}
    if(top){c.fillStyle='#d99a55';c.fillRect(x,y,TS,10);c.fillStyle='#f2c483';c.fillRect(x,y,TS,3);c.fillStyle='#7a4420';c.fillRect(x,y+10,TS,2);}
  }else if(th===1){
    c.fillStyle='#8b5a2b';c.fillRect(x,y,TS,TS);
    ell(c,x+4+h*24,y+8+h2*18,3,2,'#a87444');if(h>0.5)ell(c,x+28-h2*20,y+22,2,1.5,'#704420');
    if(top){
      c.fillStyle='#5aa838';c.fillRect(x,y,TS,11);c.fillStyle='#7cc84a';c.fillRect(x,y,TS,8);
      for(let k=0;k<4;k++){c.beginPath();c.arc(x+4+k*8,y+1,4.2,Math.PI,0);c.fill();}
      if(h>0.86){c.fillStyle='#4a9a2a';c.fillRect(x+15,y-8,2,8);ell(c,x+16,y-10,4,4,h2>0.5?'#fff':'#ffa8d8');ell(c,x+16,y-10,1.6,1.6,'#ffd34a');}
    }
  }else{
    c.fillStyle='#4a2420';c.fillRect(x,y,TS,TS);
    c.fillStyle='#2e1412';c.fillRect(x,y+15,TS,2);const off=(ty%2)*16;c.fillRect(x+off,y,2,15);c.fillRect(x+((off+16)%32),y+17,2,15);
    if(top){c.fillStyle='rgba(255,120,40,.22)';c.fillRect(x,y-5,TS,5);c.fillStyle='#6a3024';c.fillRect(x,y,TS,8);c.fillStyle='#ff8a3a';c.fillRect(x,y,TS,2);}
  }
}

// ---------- HUD ----------
function drawHUD(){
  const p=player,c=ctx;
  rr(c,10,10,286,78,14);c.fillStyle='rgba(255,248,230,0.88)';c.fill();c.lineWidth=2.5;c.strokeStyle='#c08a4a';c.stroke();
  for(let i=0;i<G.maxHp;i++)drawHeart(30+i*26,30,9.5,i<p.hp);
  c.save();c.translate(36,80);c.scale(0.72,0.72);const bb=Math.sin(G.t*0.12)*0.05;c.scale(1-bb,1+bb);drawBread(c,p.form,{face:1});c.restore();
  txt(FORMS[p.form].name,62,57,18,'#7a3a10',null,'left');
  txt(FORMS[p.form].desc+(p.form!=='plain'?'　↓/C:はきだす':''),62,76,12,'#a0603a',null,'left');
  rr(c,W-200,10,190,58,14);c.fillStyle='rgba(255,248,230,0.88)';c.fill();c.stroke();
  drawGrain(W-178,30,1.1);txt('× '+G.grains,W-160,30,18,'#7a3a10',null,'left');
  txt('スコア '+G.score,W-20,53,16,'#7a3a10',null,'right');
  if(muted)txt('おと なし（M）',W-105,82,12,'#fff','#5a2a0c');
  if(boss&&boss.state!=='sleep'&&boss.state!=='gone'){
    const bw=360,bx=W/2-bw/2,by=H-38;
    rr(c,bx-8,by-22,bw+16,44,12);c.fillStyle='rgba(30,10,5,0.75)';c.fill();
    txt('こげこげ大王',W/2,by-10,13,'#ffd36a',null);
    rr(c,bx,by,bw,12,6);c.fillStyle='#3a1a10';c.fill();
    rr(c,bx,by,Math.max(0.001,bw*boss.hp/boss.max),12,6);const hg=c.createLinearGradient(bx,0,bx+bw,0);hg.addColorStop(0,'#ff4a2a');hg.addColorStop(1,'#ffb43a');c.fillStyle=hg;c.fill();
  }else if(G.stage===0&&!G.paused){
    txt('←→:いどう　Z:ジャンプ(ながおし:ふんわり)　X:すいこみ/こうげき　↓/C:はきだす　P:ポーズ　M:おと',W/2,H-14,13,'#fff','rgba(70,35,10,0.75)');
  }
}
function drawBanner(){
  const b=G.banner;if(!b)return;
  const age=b.max-b.t,k=age<14?easeOutBack(age/14):1,al=b.t<20?b.t/20:1;
  ctx.save();ctx.globalAlpha=al;ctx.translate(W/2,150);ctx.scale(k,k);
  ctx.font=`bold 36px ${FONT}`;const tw=Math.max(ctx.measureText(b.text).width,200);
  rr(ctx,-tw/2-34,-38,tw+68,b.sub?86:64,22);ctx.fillStyle='rgba(255,248,228,0.93)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#d0883a';ctx.stroke();
  txt(b.text,0,-6,36,'#ff8a2a','#6a2a08',undefined,6);
  if(b.sub)txt(b.sub,0,30,18,'#7a3a10',null);
  ctx.restore();
}
function drawPauseBtn(){
  const r=PAUSE_BTN,c=ctx;
  rr(c,r.x,r.y,r.w,r.h,12);c.fillStyle=G.paused?'rgba(255,211,106,0.95)':'rgba(255,248,230,0.88)';c.fill();c.lineWidth=2.5;c.strokeStyle='#c08a4a';c.stroke();
  c.fillStyle='#7a3a10';c.fillRect(r.x+18,r.y+10,5,16);c.fillRect(r.x+27,r.y+10,5,16);
  txt('ポーズ',r.x+70,r.y+r.h/2+1,16,'#7a3a10',null);
}
function drawPauseMenu(){
  const c=ctx;
  c.fillStyle='rgba(30,15,5,0.55)';c.fillRect(0,0,W,H);
  rr(c,W/2-220,H/2-150,440,330,24);c.fillStyle='rgba(255,248,228,0.97)';c.fill();c.lineWidth=4;c.strokeStyle='#d0883a';c.stroke();
  txt('ポーズちゅう',W/2,H/2-108,36,'#ff8a2a','#6a2a08',undefined,6);
  PAUSE_ITEMS.forEach((s,i)=>{
    const r=menuRect(i),on=i===G.psel;
    rr(c,r.x,r.y,r.w,r.h,14);c.fillStyle=on?'#ffd36a':'#fff';c.fill();c.lineWidth=on?3:2;c.strokeStyle=on?'#c0501a':'#d8b890';c.stroke();
    txt(s,W/2+10,r.y+r.h/2+1,20,on?'#7a2a08':'#8a5a30',null);
    if(on){const b=Math.abs(Math.sin(G.t*0.15));c.save();c.translate(r.x+30,r.y+r.h-8-b*6);c.scale(0.8*(1+(b<0.2?0.12:0)),0.8*(1-(b<0.2?0.12:0)));drawBread(c,player.form,{face:1,happy:true});c.restore();}
  });
  txt('↑↓ えらぶ　Z / エンター けってい　P / エスケープ もどる',W/2,H/2+152,14,'#a0603a',null);
}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}

// ---------- タイトル / エンディング ----------
function drawBreadRow(y0,big){
  const forms=['curry','anko','plain','melon','wiener'];
  forms.forEach((f,i)=>{
    const a=G.t*0.07+i*0.9,s=Math.abs(Math.sin(a));
    const x=W/2+(i-2)*(big?120:100),y=y0-s*(big?70:50);
    let sy=s<0.25?0.72+s*1.1:1+(s-0.25)*0.12,sx=1/Math.pow(sy,0.85);
    ctx.fillStyle='rgba(60,30,10,0.18)';ctx.beginPath();ctx.ellipse(x,y0+2,22*(1-s*0.4),4,0,0,7);ctx.fill();
    ctx.save();ctx.translate(x,y);const sc=big&&f==='plain'?2.3:1.8;ctx.scale(sc*sx,sc*sy);drawBread(ctx,f,{face:i<2?1:i>2?-1:1,happy:s>0.6,mouth:s>0.8?'open':'smile'});ctx.restore();
  });
}
function drawTitle(){
  drawBG(1,G.t*1.5);
  const bob=Math.sin(G.t*0.05)*4;
  txt('やきたて！',W/2,92+bob,40,'#fff8e0','#a0521c',undefined,8);
  txt('まるパン だいぼうけん',W/2,152+bob,64,'#ffd36a','#7a3a10',undefined,11);
  drawBreadRow(345,true);
  rr(ctx,W/2-330,385,660,108,16);ctx.fillStyle='rgba(255,250,235,0.9)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#d0a060';ctx.stroke();
  txt('←→ いどう　　Z / スペース ジャンプ（ながおしで ふんわり）',W/2,408,17,'#6a3a10',null);
  txt('X ながおし：ぐざいを すいこんで へんしん　X：こうげき',W/2,436,17,'#6a3a10',null);
  txt('↓ / C：ぐざいを はきだして まるパンに もどる',W/2,464,17,'#6a3a10',null);
  if(Math.floor(G.t/30)%2===0)txt('スペース / エンター で スタート！',W/2,518,24,'#fff','#c0501a');
  drawParticles();
}
function drawEnding(){
  drawBG(1,G.endT*2);
  txt('ぜんぶ おいしく やけました！',W/2,110,46,'#ffd36a','#7a3a10',undefined,9);
  txt('こげこげ大王を やっつけて パンの せかいに へいわが もどった！',W/2,170,20,'#fff','#7a3a10');
  drawBreadRow(360,false);
  rr(ctx,W/2-200,400,400,80,16);ctx.fillStyle='rgba(255,250,235,0.92)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#d0a060';ctx.stroke();
  txt('スコア  '+G.score,W/2,425,26,'#c0501a',null);
  txt('あつめた こむぎ  '+G.grains+' こ',W/2,458,18,'#7a3a10',null);
  if(G.endT>90&&Math.floor(G.t/30)%2===0)txt('スペース / エンター で タイトルへ',W/2,512,20,'#fff','#c0501a');
  drawParticles();
}

// ---------- draw ----------
function draw(){
  ctx.setTransform(SK,0,0,SK,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(G.state==='title'){drawTitle();return;}
  if(G.state==='ending'){drawEnding();return;}
  const shx=G.shake?rand(-G.shake,G.shake):0,shy=G.shake?rand(-G.shake,G.shake):0;
  drawBG(G.theme,cam.x);
  ctx.save();ctx.translate(-Math.round(cam.x)+shx,-cam.y+shy);
  drawTiles();drawSigns();drawItems();
  for(const e of enemies)drawEnemy(e);
  drawBoss();drawProjs();drawPlayer();drawParticles();
  ctx.restore();
  if(G.flash>0){ctx.fillStyle=`rgba(255,250,220,${G.flash*0.6})`;ctx.fillRect(0,0,W,H);}
  drawHUD();drawBanner();
  if(player.dead){txt('こげちゃった…',W/2,H/2,48,'#fff','#3a1a0a',undefined,8);}
  if(G.state==='clear'){
    const k=Math.min(1,G.clearT/20);
    ctx.save();ctx.translate(W/2,H/2-40);ctx.scale(easeOutBack(k),easeOutBack(k));
    txt('ステージクリア！',0,0,60,'#ffd36a','#7a3a10',undefined,10);ctx.restore();
    if(G.clearT>40)txt('ボーナス +'+G.clearBonus,W/2,H/2+30,26,'#fff','#7a3a10');
    if(G.clearT>150&&Math.floor(G.t/25)%2===0)txt('スペース で つぎへ',W/2,H/2+75,20,'#fff','#c0501a');
  }
  if(G.state==='play')drawPauseBtn();
  if(G.paused)drawPauseMenu();
}

// ---------- loop ----------
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){
  acc+=Math.min(100,now-last);last=now;let n=0;
  while(acc>=STEP){update();for(const k in P)P[k]=false;for(const k in PK)PK[k]=false;G.click=null;acc-=STEP;if(++n>5){acc=0;break;}}
  draw();requestAnimationFrame(frame);
}
playBGM('title');
requestAnimationFrame(frame);
</script>
